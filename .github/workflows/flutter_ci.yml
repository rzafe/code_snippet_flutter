name: Flutter CI/CD

on:
  push:
    branches: [ code_snippet ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
#          channel: 'stable'
#          cache: true # Optimization for faster subsequent runs
          flutter-version: '3.38.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release
